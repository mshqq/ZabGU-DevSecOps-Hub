{% extends "base.html" %} {% block extra_head %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/auth.css') }}"
/>
{% endblock extra_head %} {% block title %}Регистрация - ZabGU DevSecOps Hub{%
endblock %} {% block content %}
<div class="w-full max-w-lg mx-auto bg-[#fafafa] rounded-2xl shadow-2xl p-10">
  <h2 class="text-4xl font-bold text-center text-[#212020] mb-10">
    Регистрация
  </h2>
  <div
    id="register-error"
    class="hidden bg-[#f8d7da] border border-[#f5c6cb] text-[#721c24] px-4 py-3 rounded mb-4"
    role="alert"
  ></div>
  <form id="register-form">
    <div class="mb-6">
      <label for="email" class="block text-xl font-medium text-[#212020] mb-2">
        Электронная почта
      </label>
      <input
        type="email"
        id="email"
        placeholder="Ваша электронная почта"
        class="w-full px-5 py-4 text-lg border border-[#d1c4c9] rounded-xl focus:ring-4 focus:border-[#8b1a4a] outline-none bg-[#ffffff] text-[#212020]"
      />
    </div>
    <div class="mb-8">
      <label
        for="password"
        class="block text-xl font-medium text-[#212020] mb-2"
      >
        Пароль
      </label>
      <input
        type="password"
        id="password"
        placeholder="Введите пароль"
        class="w-full px-5 py-4 text-lg border border-[#d1c4c9] rounded-xl focus:ring-4 focus:border-[#8b1a4a] outline-none bg-[#ffffff] text-[#212020]"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-[#8b1a4a] hover:bg-[#5c0e2e] text-white font-bold text-xl py-4 rounded-full shadow-lg"
    >
      Зарегистрироваться
    </button>
  </form>
  <p class="text-center text-lg text-[#212020] mt-8">
    Уже есть аккаунт?
    <a
      href="/login"
      class="text-[#8b1a4a] hover:text-[#5c0e2e] hover:underline font-semibold"
    >
      Войти
    </a>
  </p>
</div>
{% endblock %}
