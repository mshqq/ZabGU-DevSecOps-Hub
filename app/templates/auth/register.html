{% extends "base.html" %} {% block extra_head %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/register.css') }}"
/>
{% endblock extra_head %} {% block title %}Регистрация - ZabGU DevSecOps Hub{%
endblock %} {% block content %}
<div class="w-full max-w-lg mx-auto bg-white rounded-2xl p-10">
  <h2 class="text-4xl font-bold text-center text-[#222222] mb-10">
    Регистрация
  </h2>
  <form id="register-form">
    <div class="mb-6">
      <label for="email" class="block text-xl font-medium text-[#222222] mb-2">
        Электронная почта
      </label>
      <input
        type="email"
        id="email"
        placeholder="Ваша электронная почта"
        class="w-full px-5 py-4 text-lg border border-gray-300 rounded-xl focus:ring-4 focus:border-[#8a79d2] outline-none bg-white text-[#222222]"
      />
    </div>
    <div class="mb-8">
      <label
        for="password"
        class="block text-xl font-medium text-[#222222] mb-2"
      >
        Пароль
      </label>
      <input
        type="password"
        id="password"
        placeholder="Введите пароль"
        class="w-full px-5 py-4 text-lg border border-gray-300 rounded-xl focus:ring-4 focus:border-[#8a79d2] outline-none bg-white text-[#222222]"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-[#8a79d2] hover:bg-[#5740bf] text-white font-bold text-xl py-4 rounded-full"
    >
      Зарегистрироваться
    </button>
  </form>
  <p class="text-center text-lg text-[#222222] mt-8">
    Уже есть аккаунт?
    <a
      href="/"
      class="text-[#8a79d2] hover:text-[#5740bf] hover:underline font-semibold"
    >
      Войти
    </a>
  </p>
</div>
{% endblock %}
